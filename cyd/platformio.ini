; Skimmer Detector, CYD edition
; Board: ESP32-2432S028R "Cheap Yellow Display", 2-USB revision (USB-C + micro-USB)
;        ESP32-WROOM-32, 4 MB flash, no PSRAM, 2.8" 320x240 ST7789V (some batches ILI9342),
;        XPT2046 resistive touch, microSD, RGB LED, speaker amp on GPIO26.
;
; The USB-C port has no CC resistors: use USB-A to C or the micro-USB port to power/flash.

[env:cyd2usb]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv      ; 3 MB app, no OTA: BLE + WiFi + graphics need it
board_build.f_flash = 80000000L
board_build.flash_mode = dio

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    ; Panel: ST7789 is the usual 2-USB panel. Set -DPANEL_ILI9342=1 for the ILI9342 batches.
    -DPANEL_ILI9342=0
    ; NimBLE: observer + one client connection for the handshake probe
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    lovyan03/LovyanGFX@^1.2.7
