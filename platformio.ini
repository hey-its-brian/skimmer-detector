; Card skimmer detector - Seeed XIAO ESP32-C6 + 0.96" SSD1306 I2C OLED
; The C6 needs Arduino core 3.x, which stock PlatformIO does not ship.
; The pioarduino fork below provides it.

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv   ; BLE + WiFi stacks need > 1.25MB app slot
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
